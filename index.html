<script>
    // --- DOM Elementleri ---
    const gpxFileInput = document.getElementById('gpx-file');
    const fileNameSpan = document.getElementById('file-name');
    const startTimeInput = document.getElementById('start-time');
    const paceInput = document.getElementById('pace');
    const processBtn = document.getElementById('process-btn');
    const statusDiv = document.getElementById('status');
    const resultsDiv = document.getElementById('results');
    const allInputs = [gpxFileInput, startTimeInput, paceInput];
    const btnText = document.getElementById('btn-text');

    // Gelişmiş Ayarlar
    const fatigueFactorSlider = document.getElementById('fatigue-factor');
    const fatigueFactorValue = document.getElementById('fatigue-factor-value');
    const fatigueThresholdSlider = document.getElementById('fatigue-threshold');
    const fatigueThresholdValue = document.getElementById('fatigue-threshold-value');
    const gradeSensitivitySlider = document.getElementById('grade-sensitivity');
    const gradeSensitivityValue = document.getElementById('grade-sensitivity-value');

    function haversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const phi1 = lat1 * Math.PI / 180;
        const phi2 = lat2 * Math.PI / 180;
        const dPhi = (lat2 - lat1) * Math.PI / 180;
        const dLambda = (lon2 - lon1) * Math.PI / 180;

        const a =
            Math.sin(dPhi / 2) * Math.sin(dPhi / 2) +
            Math.cos(phi1) * Math.cos(phi2) *
            Math.sin(dLambda / 2) * Math.sin(dLambda / 2);

        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateStatus(message, type) {
        statusDiv.textContent = message;
        statusDiv.className = type;
    }

    function setLoading(isLoading) {
        if (isLoading) {
            processBtn.classList.add('loading');
            processBtn.disabled = true;
            btnText.textContent = "Simülasyon Çalışıyor...";
            allInputs.forEach(input => input.disabled = true);
        } else {
            processBtn.classList.remove('loading');
            processBtn.disabled = false;
            btnText.textContent = "Simülasyonu Başlat";
            allInputs.forEach(input => input.disabled = false);
        }
    }

    function displayResults(stats) {
        document.getElementById('result-distance').textContent =
            `${(stats.totalDistance / 1000).toFixed(2)} km`;

        document.getElementById('result-elevation').textContent =
            `${Math.round(stats.totalElevationGain)} m`;

        const hours = Math.floor(stats.totalSeconds / 3600);
        const minutes = Math.floor((stats.totalSeconds % 3600) / 60);
        const seconds = Math.round(stats.totalSeconds % 60);

        document.getElementById('result-time').textContent =
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        resultsDiv.style.display = 'block';
    }

    function parsePaceToSeconds(value) {
        const paceMatch = value.match(/^(\d+):(\d{1,2})$/);
        if (!paceMatch) throw new Error("Pace formatı geçersiz. DD:SS kullanın.");

        const min = parseInt(paceMatch[1], 10);
        const sec = parseInt(paceMatch[2], 10);

        if (sec >= 60) throw new Error("Saniye kısmı 60'tan küçük olmalı.");

        return min * 60 + sec;
    }

    function getEle(point) {
        const ele = point.querySelector('ele');
        if (!ele) return null;
        const value = parseFloat(ele.textContent);
        return Number.isFinite(value) ? value : null;
    }

    function getLatLon(point) {
        return {
            lat: parseFloat(point.getAttribute('lat')),
            lon: parseFloat(point.getAttribute('lon'))
        };
    }

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    /*
      Strava-benzeri GAP modeli.

      Fit edilen model:
          predicted_gap = actual_pace * factor

      Simülasyonda kullanıcı GAP verdiği için tersini kullanıyoruz:
          actual_pace = target_gap / factor

      Model 2 katsayıları, Strava GPX testinden:
          MAE yaklaşık 15.72 sec/km
    */
    function stravaLikeGapFactor(features, gradeSensitivity) {
        const g = features.netGrade;

        const up = Math.max(g, 0);
        const down = Math.max(-g, 0);

        const up2 = up * up;
        const down2 = down * down;
        const up3 = up2 * up;
        const down3 = down2 * down;

        const gainPerKm = features.gainPerKm;
        const lossPerKm = features.lossPerKm;
        const absElevPerKm = features.absElevPerKm;
        const meanAbsGrade = features.meanAbsGrade;

        let factor =
            1.058695149940
            + 0.616602629267 * up
            + 0.616608003250 * down
            + 10.412694441045 * up2
            - 9.204482896199 * down2
            - 8.190857426290 * up3
            + 7.966588935701 * down3
            - 0.003543832395 * gainPerKm
            + 0.001830148975 * lossPerKm
            - 0.001713683443 * absElevPerKm
            - 0.131627201332 * meanAbsGrade;

        /*
          gradeSensitivity:
          1.00 = fit edilen katsayılar
          0.50 = düzeltmeyi yarıya yaklaştırır
          1.50 = düzeltmeyi artırır

          factor 1'e yaklaştıkça düz zemin davranışı olur.
        */
        factor = 1 + (factor - 1) * gradeSensitivity;

        /*
          Güvenlik sınırı:
          Çok dik / bozuk GPX segmentlerinde absürt pace üretmesin.
          factor düşükse actual_pace = GAP / factor çok yavaşlar.
          factor yüksekse actual_pace çok hızlanır.
        */
        factor = clamp(factor, 0.35, 1.80);

        return factor;
    }

    function buildSegments(trackpoints) {
        const segments = [];
        let cumulativeDistance = 0;

        for (let i = 1; i < trackpoints.length; i++) {
            const prev = trackpoints[i - 1];
            const curr = trackpoints[i];

            const p1 = getLatLon(prev);
            const p2 = getLatLon(curr);

            const distanceMeters = haversineDistance(p1.lat, p1.lon, p2.lat, p2.lon);

            const ele1 = getEle(prev);
            const ele2 = getEle(curr);
            const elevationChange = (ele1 !== null && ele2 !== null) ? ele2 - ele1 : 0;

            const startDistance = cumulativeDistance;
            cumulativeDistance += distanceMeters;

            segments.push({
                index: i,
                startPointIndex: i - 1,
                endPointIndex: i,
                startDistance,
                endDistance: cumulativeDistance,
                distanceMeters,
                elevationChange,
                timeDeltaSeconds: 0,
                blockIndex: null
            });
        }

        return segments;
    }

    function buildOneKmBlocks(segments) {
        const blocks = [];
        let currentBlockStart = 0;
        const totalDistance = segments.length ? segments[segments.length - 1].endDistance : 0;

        while (currentBlockStart < totalDistance) {
            const currentBlockEnd = Math.min(currentBlockStart + 1000, totalDistance);

            let distance = 0;
            let netElevation = 0;
            let gain = 0;
            let loss = 0;
            let absElevation = 0;
            let weightedAbsGradeSum = 0;

            const segmentRefs = [];

            for (const seg of segments) {
                if (seg.endDistance <= currentBlockStart) continue;
                if (seg.startDistance >= currentBlockEnd) break;

                const overlapStart = Math.max(seg.startDistance, currentBlockStart);
                const overlapEnd = Math.min(seg.endDistance, currentBlockEnd);
                const overlapDistance = overlapEnd - overlapStart;

                if (overlapDistance <= 0 || seg.distanceMeters <= 0) continue;

                const ratio = overlapDistance / seg.distanceMeters;
                const de = seg.elevationChange * ratio;

                distance += overlapDistance;
                netElevation += de;

                if (de > 0) gain += de;
                if (de < 0) loss += -de;

                absElevation += Math.abs(de);

                const localGrade = de / overlapDistance;
                weightedAbsGradeSum += Math.abs(localGrade) * overlapDistance;

                segmentRefs.push(seg);
            }

            const distanceKm = distance / 1000;

            const features = {
                distanceMeters: distance,
                distanceKm,
                netElevation,
                gain,
                loss,
                absElevation,
                netGrade: distance > 0 ? netElevation / distance : 0,
                gainPerKm: distanceKm > 0 ? gain / distanceKm : 0,
                lossPerKm: distanceKm > 0 ? loss / distanceKm : 0,
                absElevPerKm: distanceKm > 0 ? absElevation / distanceKm : 0,
                meanAbsGrade: distance > 0 ? weightedAbsGradeSum / distance : 0
            };

            const block = {
                startDistance: currentBlockStart,
                endDistance: currentBlockEnd,
                features,
                segmentRefs,
                factor: 1,
                actualPaceSecPerKm: 0
            };

            const blockIndex = blocks.length;
            for (const seg of segmentRefs) {
                seg.blockIndex = blockIndex;
            }

            blocks.push(block);
            currentBlockStart = currentBlockEnd;
        }

        return blocks;
    }

    async function processGpx() {
        const file = gpxFileInput.files[0];

        if (!file) {
            updateStatus("Lütfen bir GPX dosyası seçin.", "error");
            return;
        }

        if (!startTimeInput.value) {
            updateStatus("Lütfen bir başlangıç zamanı girin.", "error");
            return;
        }

        let targetGapSeconds;
        try {
            targetGapSeconds = parsePaceToSeconds(paceInput.value);
        } catch (e) {
            updateStatus(e.message, "error");
            return;
        }

        setLoading(true);
        updateStatus("Simülasyon başlatılıyor, lütfen bekleyin...", "info");
        resultsDiv.style.display = 'none';

        try {
            let fileText = await file.text();

            /*
              Bazı GPX dosyalarında iki XML deklarasyonu olabiliyor.
              DOMParser bunu sevmez. Gerçek <gpx> kökünden başlatıyoruz.
            */
            const gpxStart = fileText.search(/<gpx\b/i);
            if (gpxStart >= 0) {
                fileText = fileText.slice(gpxStart);
            }

            const xmlDoc = new DOMParser().parseFromString(fileText, "application/xml");

            if (xmlDoc.getElementsByTagName("parsererror").length > 0) {
                throw new Error("GPX dosyası hatalı veya okunamıyor.");
            }

            const trackpoints = Array.from(xmlDoc.querySelectorAll('trkpt'));

            if (trackpoints.length < 2) {
                throw new Error("Dosyada en az 2 rota noktası bulunmalı.");
            }

            const hasElevation = trackpoints.some(p => p.querySelector('ele') !== null);

            if (!hasElevation) {
                updateStatus("Uyarı: Yükseklik verisi bulunamadı. Eğim hesaplanmayacak.", "info");
            }

            const fatigueSlowdown = parseFloat(fatigueFactorSlider.value) / 100;
            const fatigueThreshold = parseFloat(fatigueThresholdSlider.value);
            const gradeSensitivity = parseFloat(gradeSensitivitySlider.value);

            const segments = buildSegments(trackpoints);
            const blocks = buildOneKmBlocks(segments);

            let cumulativeElevationGain = 0;
            let totalDistance = 0;
            let totalSeconds = 0;
            let currentTime = new Date(startTimeInput.value);

            for (const point of trackpoints) {
                const oldTime = point.querySelector('time');
                if (oldTime) oldTime.remove();
            }

            for (const block of blocks) {
                const factor = hasElevation ? stravaLikeGapFactor(block.features, gradeSensitivity) : 1;

                const fatigueMultiplier =
                    1 + (fatigueSlowdown * Math.floor(cumulativeElevationGain / fatigueThreshold));

                /*
                  Kullanıcı GAP verdi.
                  Model: GAP = actual_pace * factor
                  Bu yüzden actual_pace = GAP / factor.
                */
                block.factor = factor;
                block.actualPaceSecPerKm = (targetGapSeconds / factor) * fatigueMultiplier;

                /*
                  Segmentlere blok pace'i uygula.
                  Gain'i blok bazında topluyoruz ki yorgunluk daha stabil olsun.
                */
                for (const seg of block.segmentRefs) {
                    const seconds = (seg.distanceMeters / 1000) * block.actualPaceSecPerKm;
                    seg.timeDeltaSeconds = seconds;

                    totalDistance += seg.distanceMeters;
                    totalSeconds += seconds;
                }

                cumulativeElevationGain += block.features.gain;
            }

            /*
              GPX time etiketlerini yeniden yaz.
              İlk noktaya başlangıç zamanı, sonraki noktalara kümülatif zaman.
            */
            const firstTimeEl = xmlDoc.createElement('time');
            firstTimeEl.textContent = currentTime.toISOString();

            const firstEleEl = trackpoints[0].querySelector('ele');
            firstEleEl ? firstEleEl.after(firstTimeEl) : trackpoints[0].appendChild(firstTimeEl);

            for (const seg of segments) {
                currentTime = new Date(currentTime.getTime() + seg.timeDeltaSeconds * 1000);

                const point = trackpoints[seg.endPointIndex];
                const timeEl = xmlDoc.createElement('time');
                timeEl.textContent = currentTime.toISOString();

                const eleEl = point.querySelector('ele');
                eleEl ? eleEl.after(timeEl) : point.appendChild(timeEl);
            }

            const newGpxText =
                '<?xml version="1.0" encoding="UTF-8"?>\n' +
                new XMLSerializer().serializeToString(xmlDoc);

            const blob = new Blob([newGpxText], { type: 'application/gpx+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = file.name.replace(/\.gpx$/i, '_simulasyon_strava_gap.gpx');

            document.body.appendChild(a);
            a.click();

            URL.revokeObjectURL(url);
            document.body.removeChild(a);

            updateStatus(`Başarılı! "${a.download}" adlı dosya indirildi.`, "success");

            displayResults({
                totalDistance,
                totalElevationGain: cumulativeElevationGain,
                totalSeconds
            });

        } catch (error) {
            console.error("Simülasyon Hatası:", error);
            updateStatus(`Hata: ${error.message}`, "error");
        } finally {
            setLoading(false);
        }
    }

    window.addEventListener('load', () => {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        startTimeInput.value = now.toISOString().slice(0, 16);
    });

    gpxFileInput.addEventListener('change', () => {
        fileNameSpan.textContent =
            gpxFileInput.files.length > 0 ? gpxFileInput.files[0].name : '';
    });

    fatigueFactorSlider.addEventListener('input', (e) => {
        fatigueFactorValue.textContent = `${e.target.value}%`;
    });

    fatigueThresholdSlider.addEventListener('input', (e) => {
        fatigueThresholdValue.textContent = `${e.target.value}m`;
    });

    gradeSensitivitySlider.addEventListener('input', (e) => {
        gradeSensitivityValue.textContent = `${parseFloat(e.target.value).toFixed(2)}x`;
    });

    processBtn.addEventListener('click', processGpx);
</script>
